<form (ngSubmit)="onUpdate()" class="w-[28em] p-8 rounded-2xl shadow-lg bg-white mx-auto mt-10">
  <h2 class="text-2xl font-semibold text-gray-800 mb-6 text-center">Update Your Recipe</h2>

  <!-- Title -->
  <div class="mb-6">
    <label class="block text-gray-800 font-medium mb-1" for="title">Title</label>
    <input
      id="title"
      type="text"
      name="title"
      [(ngModel)]="recipeItem.title"
      placeholder="Enter recipe title..."
      class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-pink-500 focus:border-pink-500 text-gray-900"
    />
    <p class="text-gray-500 text-sm mt-1">Update the title of your recipe</p>
  </div>

  <!-- Description -->
  <div class="mb-6">
    <label class="block text-gray-800 font-medium mb-1" for="description">Description</label>
    <textarea
      id="description"
      name="description"
      [(ngModel)]="recipeItem.description"
      placeholder="Enter recipe description..."
      rows="4"
      class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-pink-500 focus:border-pink-500 text-gray-900"
    ></textarea>
    <p class="text-gray-500 text-sm mt-1">Update the description of your recipe</p>
  </div>

  <!-- Food Type -->
  <div class="mb-6">
    <label class="block text-gray-800 font-medium mb-2">Food Type</label>
    <div class="flex space-x-6">
      <label class="flex items-center space-x-2 text-gray-900">
        <input
          type="radio"
          name="foodType"
          value="Vegetarian"
          [(ngModel)]="recipeItem.foodType"
          class="w-4 h-4 text-pink-500 border-gray-300 focus:ring-pink-500"
        />
        <span>Vegetarian</span>
      </label>

      <label class="flex items-center space-x-2 text-gray-900">
        <input
          type="radio"
          name="foodType"
          value="Non-Vegetarian"
          [(ngModel)]="recipeItem.foodType"
          class="w-4 h-4 text-pink-500 border-gray-300 focus:ring-pink-500"
        />
        <span>Non-Vegetarian</span>
      </label>
    </div>
    <p class="text-gray-500 text-sm mt-1">Update the type of food</p>
  </div>

  <!-- Image URL -->
  <div class="mb-6">
    <label class="block text-gray-800 font-medium mb-1" for="image">Image URL</label>
    <input
      id="image"
      type="text"
      name="image"
      [(ngModel)]="recipeItem.image"
      placeholder="Enter image URL..."
      class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-pink-500 focus:border-pink-500 text-gray-900"
    />
    <p class="text-gray-500 text-sm mt-1">Update the image link of your recipe</p>
  </div>

  <!-- Submit Button -->
  <button
    type="submit"
    class="w-full bg-pink-500 hover:bg-pink-600 text-white font-medium py-3 rounded-lg shadow-md transition duration-200"
  >
    Update Recipe
  </button>
</form>
