<mat-card class="example-card border border-gray-300 rounded-lg shadow-md">
  <mat-card-header>
    <div mat-card-avatar class="example-header-image bg-pink-500 rounded-full"></div>
    <mat-card-title class="text-gray-800">{{recipe.user.fullName}}</mat-card-title>
    <mat-card-subtitle class="text-gray-500">Student @FUAS</mat-card-subtitle>
  </mat-card-header>

  <img
    class="max-h-[400px] w-full object-cover rounded-md"
    mat-card-image
    [src]="recipe.imageUrl"
    alt="Snowy Forest"
  />

  <mat-card-content class="text-gray-700 mt-4">
    <p>
      {{recipe.description}}
    </p>
  </mat-card-content>

  <mat-card-actions class="flex justify-between mt-4">
    <div class="flex space-x-2">
      <!-- Like Button -->
      <button mat-icon-button aria-label="Like">
        <mat-icon style="color: red">favorite</mat-icon>
      </button>

      <!-- Edit Button -->
      <button (click)="handleOpenEditRecipeDialog()" mat-icon-button aria-label="Edit">
        <mat-icon style="color: black">edit</mat-icon>
      </button>

      <!-- Share Button -->
      <button mat-icon-button aria-label="Share">
        <mat-icon style="color: black">share</mat-icon>
      </button>
    </div>

    <div>
      <!-- Delete Button -->
      <button (click)="handleDeleteRecipe()" mat-icon-button aria-label="Delete">
        <mat-icon style="color: red">delete</mat-icon>
      </button>
    </div>
  </mat-card-actions>
</mat-card>
